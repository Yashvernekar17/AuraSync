<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraSync - Animated Icon Splash Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #05050a;
      --card-bg: #0b0c16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 140, 0, 0.25) 0%, rgba(200, 0, 150, 0.2) 40%, rgba(0, 0, 0, 0) 70%);
      filter: blur(50px);
      border-radius: 50%;
      z-index: 0;
      animation: ambientPulse 6s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .icon-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      filter: drop-shadow(0 15px 35px rgba(255, 60, 0, 0.3));
    }

    /* Animation Classes mapped to SVG groups */
    .spin-clockwise {
      transform-origin: 256px 256px;
      animation: spinCW 10s linear infinite;
    }

    .spin-counter {
      transform-origin: 256px 256px;
      animation: spinCCW 7s linear infinite;
    }

    .pulse-core {
      transform-origin: 256px 256px;
      animation: pulseCore 2.5s ease-in-out infinite alternate;
    }

    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulseCore {
      0% { transform: scale(0.92); opacity: 0.85; }
      100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px rgba(255, 0, 100, 0.8)); }
    }

    /* Typography */
    .title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      background: linear-gradient(135deg, #ffcc00, #ff007b, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(255, 0, 120, 0.4);
    }

    /* Simulated Progress Bar for Splash Screen */
    .loading-bar {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .loading-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ffaa00, #ff0080, #00f0ff);
      position: absolute;
      left: -100%;
      animation: loadProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loadProgress {
      0% { left: -100%; }
      50% { left: 0%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="container">
    <div class="icon-wrapper">
      <!-- Vector SVG reproducing aurasync-icon.ico -->
      <svg id="aurasync-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <!-- Outer Ring Gradient (Yellow -> Orange -> Deep Purple) -->
          <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffcc00" />
            <stop offset="45%" stop-color="#ff4500" />
            <stop offset="85%" stop-color="#800080" />
            <stop offset="100%" stop-color="#ff0066" />
          </linearGradient>

          <!-- Top Inner Arc Gradient -->
          <linearGradient id="innerTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff9900" />
            <stop offset="100%" stop-color="#ff0077" />
          </linearGradient>

          <!-- Bottom Inner Arc Gradient -->
          <linearGradient id="innerBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5500" />
            <stop offset="100%" stop-color="#00f2fe" />
          </linearGradient>

          <!-- Center Glowing Core Gradient -->
          <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff0055" />
            <stop offset="100%" stop-color="#7000ff" />
          </linearGradient>

          <!-- Glow Filter -->
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Base Dark Outer Shield Container -->
        <circle cx="256" cy="256" r="240" fill="#0b0a12" stroke="#1f182e" stroke-width="4" />
        <circle cx="256" cy="256" r="236" fill="#06050a" />

        <!-- 1. Outer Main Sync Ring (Clockwise Rotation) -->
        <g class="spin-clockwise">
          <!-- Main Thick Outer Arc -->
          <path d="M 256 56 A 200 200 0 1 1 114 114"
                fill="none"
                stroke="url(#outerGrad)"
                stroke-width="52"
                stroke-linecap="round"
                filter="url(#softGlow)" />

          <!-- White Orbital Satellite Dots on Outer Ring -->
          <circle cx="360" cy="112" r="14" fill="#ffffff" filter="url(#softGlow)" />
          <circle cx="152" cy="400" r="14" fill="#ffffff" filter="url(#softGlow)" />
        </g>

        <!-- 2. Inner Dual Sync Arcs (Counter-Clockwise Rotation) -->
        <g class="spin-counter">
          <!-- Upper Inner Arc -->
          <path d="M 140 190 A 130 130 0 0 1 315 140"
                fill="none"
                stroke="url(#innerTopGrad)"
                stroke-width="18"
                stroke-linecap="round" />
          <!-- Hot Pink Dot Endpoint -->
          <circle cx="315" cy="140" r="7" fill="#ff00a0" />

          <!-- Lower Inner Arc -->
          <path d="M 372 322 A 130 130 0 0 1 197 372"
                fill="none"
                stroke="url(#innerBottomGrad)"
                stroke-width="18"
                stroke-linecap="round" />
          <!-- Cyan Dot Endpoint -->
          <circle cx="197" cy="372" r="7" fill="#00f2fe" />
        </g>

        <!-- 3. Glowing Center Core (Pulsing Animation) -->
        <g class="pulse-core">
          <!-- Outer Glowing Ring Core -->
          <circle cx="256" cy="256" r="42" fill="url(#coreGrad)" filter="url(#softGlow)" />
          <!-- Bright White Center Spot -->
          <circle cx="256" cy="256" r="18" fill="#ffffff" />
        </g>

      </svg>
    </div>

    <!-- Typography -->
    <div class="title">AuraSync</div>

    <!-- Progress Loader -->
    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
  </div>

</body>
</html>
